<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP AI Chat Assistant</title>
    <link rel="stylesheet" href="/ui/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Modern typography for premium feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
    <div class="background-mesh">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>
    <div class="app-container">
        <header class="header">
            <div class="header-info">
                <h1>AI Assistant</h1>
                <div class="header-meta">
                    <span class="status-dot" title="Agent online"></span>
                    <p id="header-subtitle">Connected to MCP (File & Calculator)</p>
                    <span class="model-badge">gpt-4o-mini</span>
                </div>
            </div>
            <div class="header-actions">
                <label for="csv-input" class="upload-btn" title="Upload your own CSV">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </label>
                <input type="file" id="csv-input" accept=".csv" hidden>
                <button id="clear-btn" class="clear-btn" title="Clear Chat History">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                </button>
            </div>
        </header>
        
        <main class="chat-container" id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
                </div>
                <h2>How can I help you today?</h2>
                <p>I'm an agent with live tools — I can crunch numbers and read, add to, or edit your own uploaded CSV data.</p>
                <div class="suggestions-grid">
                    <button class="suggestion-chip" data-action="prompt" data-prompt="What's 128 divided by 7, and then raised to the power of 2?">
                        <span class="chip-emoji">🧮</span>
                        <span>What's 128 ÷ 7, then squared?</span>
                    </button>
                    <button class="suggestion-chip" data-action="prompt" data-prompt="What's in my uploaded file? Summarize it for me.">
                        <span class="chip-emoji">📄</span>
                        <span>What's in my uploaded file?</span>
                    </button>
                    <button class="suggestion-chip" data-action="prompt" data-prompt="Add a row: Coffee, quantity 20">
                        <span class="chip-emoji">➕</span>
                        <span>Add a row: Coffee, qty 20</span>
                    </button>
                    <button class="suggestion-chip" data-action="upload">
                        <span class="chip-emoji">⬆️</span>
                        <span>Upload a CSV to get started</span>
                    </button>
                </div>
            </div>
            <!-- Chat messages will be injected here -->
        </main>

        <footer class="input-container">
            <form id="chat-form" class="floating-input">
                <input type="text" id="user-input" placeholder="Ask something..." autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>
    <script src="/ui/app.js"></script>
</body>
</html>
